name: Build and Push to GHCR

# ============ 何时触发打包 ============
on:
  push:
    branches:
      - main          # 推送到 main 分支 → 构建并打 latest 标签
    tags:
      - 'v*'          # 推送 v 开头的 tag（如 v1.0.0）→ 额外打版本标签
  workflow_dispatch:  # 支持在 Actions 页面手动点按钮触发

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest   # GitHub 云端原生 amd64 机器，直接产出集群可用镜像
    permissions:
      contents: read
      packages: write        # 推镜像到 GHCR 必须，否则 403

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 【关键修正】GHCR 要求镜像名全小写。
      # 用户名 Youngsu-ops 含大写，直接拼进镜像地址会报 invalid reference format。
      # ${GITHUB_REPOSITORY,,} 是 bash 小写转换写法。
      - name: Set lowercase image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # Actions 内置令牌，无需手动配 secret

      # 生成标签与 OCI 元数据（结果通过 steps.meta.outputs.* 引用）
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ============ 怎么打包 + 推送到哪里 ============
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .                  # 构建上下文 = 仓库根目录
          file: ./Dockerfile          # 打包说明文件
          platforms: linux/amd64      # 明确目标架构，避免 arm64 机器上跑不起来
          push: true                  # 构建完直接推到 GHCR
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha        # 复用 GitHub Actions 缓存，二次构建从 ~4min 降到 ~40s
          cache-to: type=gha,mode=max
