<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>文章管理 - {{ .SiteName }}</title><link rel="stylesheet" href="/static/css/style.css"></head>
<body>
<nav class="navbar"><div class="nav-container"><a href="{{ adminPrefix }}/dashboard" class="nav-brand">管理后台</a><div class="nav-links"><a href="{{ adminPrefix }}/posts">文章</a><a href="{{ adminPrefix }}/sections">板块</a><a href="{{ adminPrefix }}/categories">分类</a><a href="{{ adminPrefix }}/comments">评论</a><a href="/">← 前台</a></div></div></nav>
<div class="container">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;">
        <h1 class="page-title">文章管理</h1>
        <a href="{{ adminPrefix }}/posts/new" class="btn btn-primary">+ 新建文章</a>
    </div>
    <table class="admin-table"><thead><tr><th>标题</th><th>分类</th><th>状态</th><th>阅读</th><th>时间</th><th>操作</th></tr></thead><tbody>
    {{ range .Posts }}
    <tr>
        <td><a href="/post/{{ .Slug }}" style="color:inherit;text-decoration:none;font-weight:500;">{{ .Title }}</a></td>
        <td>{{ if .Category }}{{ .Category.Name }}{{ end }}</td>
        <td>{{ if eq .Status "published" }}<span style="color:#34C759;">已发布</span>{{ else }}<span style="color:#86868b;">草稿</span>{{ end }}</td>
        <td>{{ .Views }}</td>
        <td>{{ dateFmt .CreatedAt }}</td>
        <td><div class="admin-actions"><a href="{{ adminPrefix }}/posts/{{ .ID }}/edit" class="action-edit">编辑</a><button onclick="del({{ .ID }})" class="action-del">删除</button></div></td>
    </tr>
    {{ end }}
    </tbody></table>
</div>
<script>
function del(id) { if(confirm('确定删除？')){ fetch('{{ adminPrefix }}/posts/'+id,{method:'DELETE'}).then(r=>{ if(r.ok) location.reload(); }); } }
</script>
</body>
</html>
